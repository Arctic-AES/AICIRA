name: Python baseline tests

on:
  push:
    branches: [main, feat/baseline-solver]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e software
      - name: Unit tests
        run: python -m unittest discover -s software/tests -v
      - name: Analytical sanity check
        run: python -m aicira baseline
